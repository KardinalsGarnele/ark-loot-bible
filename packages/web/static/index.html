<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="ARK Loot Bible – verknüpfte, verifizierbare ARK-Daten.">
  <title>ARK Loot Bible</title><link rel="stylesheet" href="/static/styles.css">
</head>
<body>
<header class="topbar"><a class="brand" href="#/">ARK <strong>Loot Bible</strong></a><nav><a href="#/">Suche</a><a href="/docs">API</a></nav></header>
<main>
  <section id="home" class="hero">
    <p class="eyebrow">Simple for players · Powerful by design</p>
    <h1>Ein Suchfeld.<br><span>Das ganze ARK-Universum.</span></h1>
    <p class="lead">Creatures, Items, Blueprints und Loot als verbundenes Wissensnetz – mit sichtbarem Verifikationsstatus statt geratenen Werten.</p>
    <form id="search-form" class="search" role="search">
  <input
    id="search"
    autocomplete="off"
    placeholder="Rex, Saddle, Blueprint …"
    aria-label="Alles durchsuchen"
  >

  <button>Suchen</button>
</form>

<div class="search-filters" aria-label="Entity-Typen">
<label class="filter-all">
  <input id="filter-all" type="checkbox" checked>
  <span>Alle <span class="filter-count" data-filter-count="ALL"></span></span>
</label>
<label>
  <input type="checkbox" value="CREATURE" checked>
  <span>Creature <span class="filter-count" data-filter-count="CREATURE"></span></span>
</label>
 <label>
  <input type="checkbox" value="ITEM" checked>
  <span>Item <span class="filter-count" data-filter-count="ITEM"></span></span>
</label>
  <label>
  <input type="checkbox" value="BLUEPRINT" checked>
  <span>Blueprint <span class="filter-count" data-filter-count="BLUEPRINT"></span></span>
</label>
<label>
  <input type="checkbox" value="LOOT_SET" checked>
  <span>Loot Set <span class="filter-count" data-filter-count="LOOT_SET"></span></span>
</label>
<label>
  <input type="checkbox" value="LOOT_ENTRY" checked>
  <span>Loot Entry <span class="filter-count" data-filter-count="LOOT_ENTRY"></span></span>
</label>
<label>
  <input type="checkbox" value="CREATURE_VARIANT" checked>
  <span>Variant <span class="filter-count" data-filter-count="CREATURE_VARIANT"></span></span>
</label>
</div>
    <label class="toggle"><input id="preview" type="checkbox"> Entwicklungsvorschau anzeigen</label>
    <section id="status" class="status" aria-live="polite"></section><section id="results" class="grid"></section>
  </section>
  <section id="entity" hidden></section>
</main>
<footer>Build the platform. Everything else is an interface. · <span id="version"></span></footer>
<script src="/static/app.js"></script></body></html>
